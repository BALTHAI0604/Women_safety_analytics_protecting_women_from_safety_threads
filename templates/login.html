<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Women Safety Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="auth-body">


<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-md-5">

            <div class="auth-card">

                <div class="text-center mb-4">

                    <div class="auth-icon">
                        🛡️
                    </div>

                    <h2 class="fw-bold">
                        Welcome Back
                    </h2>

                    <p class="text-muted">
                        Login to your Women Safety account
                    </p>

                </div>


                <form action="/login"
                      method="POST">


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter your password"
                            required>

                    </div>


                    <!-- SHOW PASSWORD -->

                    <div class="form-check mb-3">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="showPassword"
                            onclick="showPasswordFunction()">

                        <label class="form-check-label">
                            Show Password
                        </label>

                    </div>


                    <!-- LOGIN -->

                    <button
                        type="submit"
                        class="btn btn-danger w-100 py-2">

                        🔐 Login

                    </button>


                </form>


                <div class="text-center mt-4">

                    <p class="mb-0">
                        Don't have an account?
                    </p>

                    <a href="/register"
                       class="text-danger fw-bold">

                        Create Account

                    </a>

                </div>


                <div class="text-center mt-3">

                    <a href="/"
                       class="text-decoration-none">

                        ← Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

function showPasswordFunction() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>


</body>
</html>
