<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Women Safety Analytics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body class="auth-body">


<div class="container">

    <div class="row justify-content-center py-5">

        <div class="col-md-6">

            <div class="auth-card">

                <div class="text-center mb-4">

                    <div class="auth-icon">
                        🛡️
                    </div>

                    <h2 class="fw-bold">
                        Create Account
                    </h2>

                    <p class="text-muted">
                        Register for Women Safety Analytics
                    </p>

                </div>


                <form action="/register"
                      method="POST">


                    <!-- FULL NAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="fullname"
                            class="form-control"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <!-- EMAIL -->

                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required>

                    </div>


                    <!-- PHONE -->

                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            placeholder="Enter your phone number"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control"
                            placeholder="Create a password"
                            minlength="6"
                            required>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm your password"
                            minlength="6"
                            required>

                    </div>


                    <!-- TERMS -->

                    <div class="form-check mb-3">

                        <input
                            type="checkbox"
                            class="form-check-input"
                            required>

                        <label class="form-check-label">

                            I agree to the
                            <span class="text-danger">
                                Terms & Conditions
                            </span>

                        </label>

                    </div>


                    <!-- REGISTER -->

                    <button
                        type="submit"
                        class="btn btn-danger w-100 py-2">

                        📝 Create Account

                    </button>


                </form>


                <div class="text-center mt-4">

                    <p class="mb-1">
                        Already have an account?
                    </p>

                    <a href="/login"
                       class="text-danger fw-bold">

                        Login Here

                    </a>

                </div>


                <div class="text-center mt-3">

                    <a href="/">
                        ← Back to Home
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

document.querySelector("form").addEventListener(
    "submit",
    function(event) {

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {

            event.preventDefault();

            alert("Passwords do not match!");

        }

    }
);

</script>


</body>
</html>
